[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcut"
version = "1.51.0"
description = "The autonomous video editing engine built for AI agents. Zero external Python dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSL-1.1"}
authors = [
    {name = "Ahmad Shady", email = "ahmadshady747@gmail.com"}
]
keywords = ["video", "editor", "agent", "mcp", "ffmpeg", "multimedia", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
agentcut = "agentcut.__main__:main"
agentcut-mcp = "agentcut.server:main"

[tool.setuptools.packages.find]
where = ["src"]

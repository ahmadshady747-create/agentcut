name: tests

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast-unit-tests:
    name: Fast Unit & Core Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg & HarfBuzz
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libharfbuzz0b
      - name: Verify package install (editable)
        # NOTE: no --no-build-isolation. The setup-python 3.12 image
        # ships WITHOUT setuptools, so --no-build-isolation makes
        # this step fail with "No module named 'setuptools'"
        # (run 44750049307). With build isolation pip installs
        # setuptools>=61.0 from pyproject.toml into the build env.
        run: pip install --no-deps -e .
      - name: Run 3.4.5 test suite
        run: |
          PYTHONPATH=src python3 -m unittest \
            tests/test_browser_render.py \
            tests/test_flat_reels.py \
            tests/test_v340_browser_engine.py \
            tests/test_v341_beat_sync.py \
            tests/test_v342_charts_icons_captions.py \
            tests/test_v343_brand_multi_templates.py \
            tests/test_v344_patch_pipe_qc.py \
            tests/test_v345_director_studio_doctor.py -v
      - name: CLI smoke test
        # No render here: CI has no Chromium and the example specs
        # reference narration audio that is not in the repo. doctor
        # and preflight cover import + spec validation without a
        # browser; rendering is verified locally with Playwright.
        run: |
          PYTHONPATH=src python3 -m agentcut doctor
          PYTHONPATH=src python3 -m agentcut preflight examples/reel_winter_60s.json --no-audio

  full-integration-tests:
    name: Full Render Integration Suite
    runs-on: ubuntu-24.04
    # 3.4.5 suite is 81 tests across 8 modules (browser tests skip
    # without Playwright); 30 minutes is far more than enough.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg & HarfBuzz
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libharfbuzz0b
      - name: Run sharded integration tests
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, sys
          shard = int(os.environ.get("SHARD", "1"))
          files = sorted(glob.glob("tests/test_*.py"))
          selected = [f for i, f in enumerate(files) if (i % 2) + 1 == shard]
          print(f"Shard {shard} running {len(selected)} test modules:", selected)
          env = dict(os.environ, PYTHONPATH="src")
          rc = subprocess.call([sys.executable, "-m", "unittest", *selected, "-v"], env=env)
          sys.exit(rc)
          PY
        env:
          SHARD: ${{ matrix.shard }}
